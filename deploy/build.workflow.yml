name: Build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore TaskTrack.slnx
      - run: dotnet build TaskTrack.slnx --configuration Release --no-restore
      - run: dotnet publish TaskTrack/TaskTrack.csproj --configuration Release --no-build --output artifacts/site
